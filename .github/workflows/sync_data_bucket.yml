name: Sync data folder to HF Bucket

on:
  workflow_run:
    workflows: ["Update Data Daily"]
    types:
      - completed

  workflow_dispatch:

jobs:
  sync-data:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    runs-on: ubuntu-latest

    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install HF CLI (with buckets support)
        run: |
          pip install -U "huggingface_hub[buckets]"

      - name: Verify data folder exists
        run: |
          ls -R ./data

      - name: Sync data folder to Hugging Face bucket
        run: |
          hf buckets sync ./data \
            hf://buckets/e-zaline/power-plant-tracker/data \
            --delete
        env:
          HUGGINGFACE_HUB_TOKEN: ${{ secrets.HF_TOKEN }}