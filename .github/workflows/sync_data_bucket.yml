name: Sync data folder to Hugging Face bucket

on:
  workflow_run:
    workflows: ["Update Data Daily"]
    types:
      - completed

  workflow_dispatch:

jobs:
  sync-data:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    runs-on: ubuntu-latest

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      HF_TOKEN: ${{ secrets.HF_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Debug workspace
        run: ls -R

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Verify HF token exists
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "HF_TOKEN is missing"
            exit 1
          fi

      - name: Upload data folder to HF Space bucket
        run: |
          uvx hf upload \
            e-zaline/power-plant-tracker \
            ./data \
            /data \
            --repo-type=space \
            --token=$HF_TOKEN