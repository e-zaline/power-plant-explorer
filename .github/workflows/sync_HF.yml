name: Sync to Hugging Face hub

on:
  workflow_run:
    workflows: ["Update Data Daily"]
    types:
      - completed
  workflow_dispatch:  # keep manual trigger
    # Allows manual trigger from GitHub UI

permissions:
  contents: write
  id-token: write

jobs:
  sync-to-hub:
    # only run when the triggering workflow completed successfully
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - name: Push to hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: uvx hf upload e-zaline/power-plant-tracker . --repo-type=space --token=$HF_TOKEN
